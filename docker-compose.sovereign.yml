# =============================================================================
# the01.dev — Sovereign Hermes stack (production deployment template)
# =============================================================================
# Everything runs on infrastructure YOU control — no external cloud LLM.
# This is the production topology the local demo maps onto 1:1.
#
#   Browser ─► frontend (nginx) ─► backend (FastAPI: gate + EU-AI-Act audit)
#                                       └─► hermes (:8642 agent runtime)
#                                             ├─► ollama|vllm  (local model)
#                                             ├─► mcp tool ────► backend retriever
#                                             └─► postgres+pgvector (RAG + memory)
#
#   Nothing crosses this boundary → sovereign.
#
# Dev/demo (8GB laptop): run ollama with a small model.
# Production: swap the `llm` service for a vLLM container on a GPU node
#             (same OpenAI-compatible /v1 interface — one config change).
# -----------------------------------------------------------------------------

services:
  # ---- The local model server (the sovereign LLM) --------------------------
  llm:
    # DEV: Ollama. PROD on a GPU host, replace with:
    #   image: vllm/vllm-openai:latest
    #   command: --model Qwen/Qwen2.5-7B-Instruct --max-model-len 65536
    #   deploy: { resources: { reservations: { devices: [{capabilities: [gpu]}] } } }
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"       # OpenAI-compatible endpoint at /v1
    restart: unless-stopped

  # ---- Postgres + pgvector (RAG index + HindSight memory backend) -----------
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: the01dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: the01dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ---- Hermes agent runtime (:8642 OpenAI-compatible API) -------------------
  hermes:
    # Build from the NousResearch/hermes-agent repo, or use the published image.
    # See hermes-agent.nousresearch.com/docs/user-guide/docker
    image: nousresearch/hermes-agent:latest   # placeholder — pin the real tag
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: ${HERMES_API_KEY:-change-me}
      # point Hermes at the local model + local memory Postgres
      HINDSIGHT_MODE: local
    volumes:
      - ./backend/hermes/SOUL.md:/root/.hermes/SOUL.md:ro   # versioned identity
      - hermes_state:/root/.hermes
    depends_on: [llm, db]
    ports:
      - "127.0.0.1:8642:8642"
    restart: unless-stopped

  # ---- FastAPI governance layer (gate + EU-AI-Act audit + proxy) ------------
  backend:
    build: ./backend
    environment:
      HERMES_URL: http://hermes:8642
      HERMES_API_KEY: ${HERMES_API_KEY:-change-me}
      DATABASE_URL: postgresql://the01dev:${DB_PASSWORD:-change-me}@db:5432/the01dev
      # For full sovereignty, point embeddings at the local model too (roadmap):
      # EMBEDDINGS_PROVIDER: ollama
    depends_on: [hermes, db]
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ---- Static React frontend ------------------------------------------------
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  ollama_models:
  pgdata:
  hermes_state:
